<script>
window.addEventListener('error', function(e) {
  var el = document.getElementById('err');
  if (el) { el.style.display = 'block'; el.textContent = 'ERREUR: ' + e.message; }
});

var KEY = 'mdpc_v70';
var state = { currentUser: null, users: {} };
try { var raw = localStorage.getItem(KEY); if (raw) state = JSON.parse(raw); } catch (e) {}

function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} header(); }
function user() { return state.currentUser ? state.users[state.currentUser] : null; }
function mkUser(n) { return { name: n, done: {}, certs: [], examens: {}, jours: {}, created: new Date().toISOString().slice(0,10) }; }
function today() { return new Date().toISOString().slice(0,10); }

function countDone(lvl) {
  var u = user(); if (!u) return 0;
  var c = 0, p = lvl + '_';
  for (var k in u.done) { if (k.indexOf(p) === 0 && u.done[k]) c++; }
  return c;
}
function isComplete(lvl) { return countDone(lvl) >= 10; }
function isUnlocked(lvl) { if (lvl === 1) return true; return isComplete(lvl - 1); }

function simulate() {
  var u = user(); if (!u) return;
  for (var i = 1; i <= 10; i++) {
    u.done['1_'+i]=true; u.done['2_'+i]=true; u.done['3_'+i]=true;
    u.done['4_'+i]=true; u.done['5_'+i]=true; u.done['6_'+i]=true;
  }
  save();
  alert('N1-N6 simulés. Niveau 7 débloqué !');
  route();
}

function login() {
  var el = document.getElementById('loginName'); if (!el) return;
  var n = el.value.trim(); if (!n) { alert('Entre ton prénom'); return; }
  var k = n.toLowerCase().replace(/\s+/g, '_');
  if (!state.users[k]) state.users[k] = mkUser(n);
  state.currentUser = k; save(); go('home');
}
function logout() { state.currentUser = null; save(); go('login'); }
function go(h) { location.hash = h; }

var DEFIS = [
{id:1, titre:"Introduction à l analyse malware", intro:"Un malware est un programme malveillant. Comprendre ses types et son fonctionnement est essentiel pour le combattre.",
cours:"<h3>Qu est-ce qu un malware</h3><p><strong>Malware</strong> = logiciel conçu pour nuire : voler des données, chiffrer des fichiers, espionner, prendre le contrôle.</p><h3>Les types principaux</h3><table><tr><th>Type</th><th>Description</th></tr><tr><td><strong>Virus</strong></td><td>Se fixe à un fichier, se propage à l exécution</td></tr><tr><td><strong>Ver (worm)</strong></td><td>Se propage seul sur le réseau</td></tr><tr><td><strong>Trojan</strong></td><td>Se déguise en logiciel légitime</td></tr><tr><td><strong>Ransomware</strong></td><td>Chiffre les fichiers, demande rançon</td></tr><tr><td><strong>Spyware</strong></td><td>Espionne (frappes, écran, réseau)</td></tr><tr><td><strong>Rootkit</strong></td><td>Cache sa présence, modifie le kernel</td></tr><tr><td><strong>Botnet</strong></td><td>Réseau de machines zombie contrôlées</td></tr><tr><td><strong>Keylogger</strong></td><td>Enregistre les frappes clavier</td></tr><tr><td><strong>Adware</strong></td><td>Affiche publicités malveillantes</td></tr><tr><td><strong>Cryptominer</strong></td><td>Mine crypto en arrière-plan</td></tr></table><h3>Objectifs</h3><ul><li>Voler données bancaires / identifiants</li><li>Chiffrer contre rançon (ransomware)</li><li>Espionner (nation-state, espionnage industriel)</li><li>Détruire (sabotage, cyberattaque)</li><li>Miner crypto (financier)</li></ul><div class=\"box\">Un malware = un cambrioleur déguisé. Il entre par une porte (vulnérabilité), se cache (rootkit), agit (vol/chiffrement), sort (exfiltration).</div><div class=\"bank\">Les banques sont ciblées par ransomwares, trojans bancaires (Zeus, Emotet) et APT (Advanced Persistent Threats).</div><div class=\"warn\">Un utilisateur averti bloque 80% des infections : ne pas cliquer sur les pièces jointes, vérifier les URLs, MFA.</div>",
cas:"<h3>Cas 1 — Classifier un échantillon</h3><p>Analyser un fichier suspect avec <code>file</code> :</p><pre>file suspect.exe\nstrings suspect.exe | head -30</pre><p>Résultat : PE32 executable = Windows. Strings révèlent des URLs, IPs, noms de fonctions.</p><h3>Cas 2 — Reconnaître un ransomware</h3><p>Fichiers avec extension bizarre (.encrypted, .locked, .crypt), message rançon README.txt. Chiffrement AES+RSA. Demande BTC.</p><h3>Cas 3 — Reconnaître un cryptominer</h3><p>CPU 100% sans raison. Processus xmrig, minerd. Connexion à des pools de mining (pool.minexmr.com).</p>",

{q:'Un rootkit sert à ?',o:['Se cacher + modifier kernel','Chiffrer','Miner','Voler cookies'],c:0,e:'Furtivité.'}
]},

{id:2, titre:"Environnement d analyse sécurisé", intro:"Analyser un malware = manipuler du code dangereux. Il faut un environnement isolé (sandbox).",
cours:"<h3>Pourquoi une sandbox</h3><p>Un malware peut s exécuter, se propager, contacter son C2. En sandbox, on l empêche de nuire.</p><h3>Types de sandbox</h3><ul><li><strong>VM</strong> — VirtualBox, VMware, Hyper-V</li><li><strong>Conteneur</strong> — Docker (moins isolé)</li><li><strong>Sandbox cloud</strong> — Any.run, Hybrid Analysis, Joe Sandbox</li><li><strong>Machine physique dédiée</strong> — air-gap, aucune connexion</li></ul><h3>Configuration recommandée</h3><ul><li><strong>Aucune connexion au réseau réel</strong> — réseau host-only ou NAT isolé</li><li><strong>Snapshot avant analyse</strong> — rollback après</li><li><strong>Outils pré-installés</strong> — REMnux (Linux), FlareVM (Windows)</li><li><strong>Faux services réseau</strong> — INetSim simule DNS, HTTP, SMTP</li><li><strong>Journalisation</strong> — capture réseau, monitoring fichiers, registre</li></ul><h3>REMnux</h3><p>Distribution Linux dédiée à l analyse malware. Contient : Volatility, YARA, radare2, oledump, peepdf, CyberChef, etc.</p><h3>FlareVM</h3><p>VM Windows pré-configurée par Mandiant. Contient : IDA Free, x64dbg, PEiD, Process Hacker, Wireshark, etc.</p><div class=\"box\">Analyser un malware = manipuler une bombe. Sandbox = bunker anti-explosion. Air-gap = bunker isolé.</div><div class=\"bank\">Banques : toute analyse malware passe par une sandbox isolée, jamais sur un poste de travail.</div><div class=\"warn\">Jamais analyser sur un PC personnel non isolé. Jamais connecter la sandbox au réseau de l entreprise.</div>",
cas:"<h3>Cas 1 — Créer une VM isolée</h3><ol><li>VirtualBox → Nouvelle VM → Windows 10 ou Ubuntu</li><li>Configuration réseau : Host-only adapter (pas de NAT)</li><li>Snapshot avant exécution</li><li>Prendre un snapshot « vierge » et un snapshot « après analyse »</li></ol><h3>Cas 2 — INetSim</h3><pre>sudo inetsim</pre><p>Simule DNS, HTTP, SMTP. Le malware croit avoir Internet. On capture toutes ses requêtes.</p><h3>Cas 3 — Snapshot rollback</h3><p>Après analyse : restauration du snapshot → machine propre → prête pour nouvel échantillon.</p>",

]},

{id:3, titre:"Analyse statique de base", intro:"Analyser un binaire SANS l exécuter. Extraire un maximum d infos sur ce qu il fait.",
cours:"<h3>Principe</h3><p><strong>Analyse statique</strong> = examiner le fichier sans l exécuter. Aucun risque d infection.</p><h3>Outils essentiels</h3><table><tr><th>Outil</th><th>Usage</th></tr><tr><td>file</td><td>Type de fichier</td></tr><tr><td>strings</td><td>Chaînes lisibles</td></tr><tr><td>xxd / hexdump</td><td>Vue hexadécimale</td></tr><tr><td>md5sum / sha256sum</td><td>Empreintes</td></tr><tr><td>pefile (Python)</td><td>Analyse PE Windows</td></tr><tr><td>PEiD</td><td>Détection packer</td></tr><tr><td>Detect It Easy</td><td>Identifier compilateur/packer</td></tr><tr><td>objdump</td><td>Désassemblage</td></tr><tr><td>radare2</td><td>Reverse engineering</td></tr><tr><td>strings.fr</td><td>Version française</td></tr></table><h3>Commandes clés</h3><pre>file suspect.exe\nstrings -n 8 suspect.exe\nmd5sum suspect.exe\nsha256sum suspect.exe\nxxd suspect.exe | head -20</pre><h3>Ce qu on cherche dans strings</h3><ul><li><strong>URLs</strong> — serveur C2</li><li><strong>Adresses IP</strong></li><li><strong>Noms de registre</strong> — persistance</li><li><strong>Noms de fichiers</strong> — cibles</li><li><strong>Mots-clés</strong> — bitcoin, ransom, encrypt, password</li><li><strong>User-Agents</strong></li><li><strong>Noms de fonctions API</strong> — CreateProcess, URLDownloadToFile</li></ul><div class=\"box\">Analyse statique = lire le code source d une bombe. Sans la faire exploser.</div><div class=\"bank\">Un analyste bancaire commence TOUJOURS par strings. Souvent suffisant pour identifier une famille (Emotet, Qakbot).</div><div class=\"warn\">Un binaire packé affiche peu de strings. Il faut alors le dépacker (analyse dynamique) ou utiliser des techniques avancées.</div>",
cas:"<h3>Cas 1 — Analyse d un suspect.exe</h3><pre>file suspect.exe\n→ PE32 executable (GUI) Intel 80386, for MS Windows\n\nstrings suspect.exe | grep -i http\n→ http://malicious-c2.xyz/gate.php\n\nstrings suspect.exe | grep -i bitcoin\n→ Bitcoin wallet found</pre><p>Conclusion : trojan bancaire communiquant avec un C2.</p><h3>Cas 2 — Détecter un packer</h3><pre>Die (Detect It Easy) → suspect.exe\n→ UPX 3.96 (packer connu)\n\nupx -d suspect.exe -o unpacked.exe</pre><p>Le binaire a été dépacké → strings donne plus d infos.</p><h3>Cas 3 — Hash lookup</h3><pre>sha256sum suspect.exe\n→ e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855</pre><p>Rechercher sur VirusTotal : si déjà connu, résultat immédiat.</p>",
quiz:[
{q:'Analyse statique ?',o:['Sans exécuter','Avec exécution','En sandbox','En live'],c:0,e:'Sans exécuter.'},
{q:'strings sert à ?',o:['Chiffrer','Extraire chaînes','Router','Hasher'],c:1,e:'Chaînes lisibles.'}
]},

{id:4, titre:"Analyse dynamique — Sandbox et monitoring", intro:"Exécuter le malware dans une sandbox en observant TOUT ce qu il fait.",
cours:"<h3>Principe</h3><p><strong>Analyse dynamique</strong> = exécuter dans un environnement isolé en surveillant chaque action.</p><h3>Ce qu on observe</h3><ul><li><strong>Processus</strong> — création, injection, terminaison</li><li><strong>Fichiers</strong> — création, modification, suppression</li><li><strong>Registre</strong> — persistance, configuration</li><li><strong>Réseau</strong> — connexions, DNS, HTTP</li><li><strong>Mémoire</strong> — code injecté, chaînes en clair</li></ul><h3>Outils de monitoring</h3><table><tr><th>Outil</th><th>Usage</th></tr><tr><td>Process Monitor (Procmon)</td><td>Fichiers, registre, processus en temps réel</td></tr><tr><td>Process Hacker / System Informer</td><td>Processus avancés, injections</td></tr><tr><td>Wireshark</td><td>Capture réseau</td></tr><tr><td>Fiddler</td><td>Proxy HTTP/HTTPS</td></tr><tr><td>Regshot</td><td>Diff registre avant/après</td></tr><tr><td>API Monitor</td><td>Appels API Windows</td></tr><tr><td>x64dbg</td><td>Debugger</td></tr></table><h3>Sandboxes en ligne</h3><ul><li><strong>Any.run</strong> — interactif, gratuit en limité</li><li><strong>Hybrid Analysis</strong> — rapport détaillé gratuit</li><li><strong>Joe Sandbox</strong> — payant, très complet</li><li><strong>VirusTotal</strong> — sandbox intégrée (gratuit)</li></ul><div class=\"box\">Analyse dynamique = regarder la bombe exploser dans un bunker. On note chaque fragment, chaque fumée, chaque bruit.</div><div class=\"bank\">Une sandbox bancaire doit être déconnectée du réseau réel. C2 simulé, DNS contrôlé, aucun accès externe.</div><div class=\"warn\">Un malware évolué détecte la sandbox (VM, timers, debugger). Techniques : délai, détection VMware, refus d exécution.</div>",
cas:"<h3>Cas 1 — Procmon</h3><ol><li>Lancer Procmon avant le malware</li><li>Exécuter le malware</li><li>Filtrer par ProcessName = suspect.exe</li><li>Observer : CreateFile (fichiers créés), RegSetValue (persistance), ProcessCreate (child processes)</li></ol><h3>Cas 2 — Wireshark</h3><ol><li>Lancer capture sur l interface virtuelle</li><li>Exécuter le malware</li><li>Filtrer : dns, http, tcp.port==443</li><li>Identifier : domaine C2, User-Agent, données exfiltrées</li></ol><h3>Cas 3 — Any.run</h3><p>Uploader le binaire sur any.run. Rapport automatique : processus, réseau, MITRE ATT&amp;CK, screenshots.</p>",
quiz:[
{q:'Analyse dynamique ?',o:['Sans exécuter','Exécution observée','En lecture seule','Hash'],c:1,e:'Exécution.'},
{q:'Procmon surveille ?',o:['Fichiers/registre/processus','Réseau seul','Mémoire seule','CPU'],c:0,e:'Tout.'}
]},

{id:5, titre:"Analyse de fichiers PE (Windows)", intro:"La majorité des malwares Windows sont des fichiers PE (Portable Executable). Comprendre leur structure est essentiel.",
cours:"<h3>Structure d un PE</h3><ul><li><strong>DOS Header</strong> — signature MZ (0x4D5A)</li><li><strong>DOS Stub</strong> — « This program cannot be run in DOS mode »</li><li><strong>PE Header</strong> — signature PE + infos machine</li><li><strong>Optional Header</strong> — point d entrée, sections</li><li><strong>Sections</strong> — code (.text), données (.data), ressources (.rsrc)</li></ul><h3>Sections typiques</h3><table><tr><th>Section</th><th>Contenu</th></tr><tr><td>.text</td><td>Code exécutable</td></tr><tr><td>.data</td><td>Données initialisées</td></tr><tr><td>.rdata</td><td>Données en lecture seule (strings)</td></tr><tr><td>.rsrc</td><td>Ressources (icônes, dialogues)</td></tr><tr><td>.reloc</td><td>Relocations</td></tr></table><h3>Anomalies suspectes</h3><ul><li><strong>Entry point</strong> dans une section inhabituelle (.rsrc, .data)</li><li><strong>Sections</strong> avec noms bizarres (.upx0, .packed, .xyz)</li><li><strong>Entropie élevée</strong> (chiffré ou packé)</li><li><strong>Peu d imports</strong> (packé)</li><li><strong>Imports suspects</strong> : VirtualAlloc, WriteProcessMemory, CreateRemoteThread, URLDownloadToFile, WinExec</li><li><strong>Pas de signature</strong> numérique</li><li><strong>Timestamp</strong> incohérent</li></ul><h3>Outils</h3><ul><li><strong>PEview</strong> — visualiser la structure</li><li><strong>PEStudio</strong> — analyse automatique</li><li><strong>CFF Explorer</strong> — éditeur</li><li><strong>Detect It Easy (DIE)</strong> — packer/compilateur</li><li><strong>pefile (Python)</strong> — analyse programmatique</li></ul><h3>Réseau et persistance</h3><ul><li>Imports réseau : WinINet, WinHTTP, socket</li><li>Imports registre : RegOpenKey, RegSetValue</li><li>Imports processus : CreateProcess, ShellExecute</li></ul><div class=\"box\">Un PE = un livre. Le DOS header = couverture. Le PE header = sommaire. Les sections = chapitres. Un malware = un livre piégé.</div><div class=\"bank\">Banques : toute analyse PE commence par vérifier la signature numérique. Un binaire non signé = suspect.</div><div class=\"warn\">Un PE peut être packé (UPX, Themida, VMProtect). Il faut le dépacker avant analyse.</div>",
cas:"<h3>Cas 1 — PEStudio</h3><ol><li>Charger suspect.exe dans PEStudio</li><li>Onglet Indicators : score de suspicion</li><li>Onglet Imports : API suspectes</li><li>Onglet Strings : URLs, IPs</li><li>Onglet Sections : entropie, noms</li></ol><h3>Cas 2 — pefile (Python)</h3><pre>import pefile\npe = pefile.PE('suspect.exe')\nprint(pe.OPTIONAL_HEADER.AddressOfEntryPoint)\nfor section in pe.sections:\n    print(section.Name, section.get_entropy())</pre><h3>Cas 3 — Détecter un packer</h3><pre>diec suspect.exe</pre><p>Résultat : UPX, Themida, VMProtect. Si packé, tenter upx -d ou analyse dynamique.</p>",
quiz:[
{q:'Un PE est un fichier ?',o:['Linux','Windows exécutable','PDF','ZIP'],c:1,e:'Windows.'},
{q:'Entropie élevée signifie ?',o:['Fichier simple','Chiffré/packé','Vide','Corrompu'],c:1,e:'Chiffrement.'}
]},

{id:6, titre:"Analyse de mémoire (forensics RAM)", intro:"Un malware peut vivre uniquement en mémoire. Analyser la RAM révèle ce que le disque cache.",
cours:"<h3>Pourquoi la RAM</h3><ul><li><strong>Malware fileless</strong> — jamais écrit sur disque</li><li><strong>Clés de chiffrement</strong> — en mémoire pendant l exécution</li><li><strong>Processus cachés</strong> — rootkits</li><li><strong>Connexions réseau</strong> — C2 actifs</li><li><strong>Mots de passe</strong> — en clair</li></ul><h3>Capturer la RAM</h3><ul><li><strong>Windows</strong> : DumpIt, FTK Imager, WinPmem</li><li><strong>Linux</strong> : LiME, /proc/kcore</li><li><strong>VM</strong> : VMware (snapshot mémoire), VirtualBox (dump)</li></ul><h3>Volatility</h3><p>Framework open source d analyse mémoire. Version 3 (Volatility3) est la plus récente.</p><pre>vol.py -f memory.dmp imageinfo\nvol.py -f memory.dmp --profile=Win10x64 pslist\nvol.py -f memory.dmp --profile=Win10x64 netscan\nvol.py -f memory.dmp --profile=Win10x64 cmdline\nvol.py -f memory.dmp --profile=Win10x64 hashdump\nvol.py -f memory.dmp --profile=Win10x64 malfind</pre><h3>Commandes clés</h3><table><tr><th>Commande</th><th>Usage</th></tr><tr><td>imageinfo</td><td>Profil de l OS</td></tr><tr><td>pslist</td><td>Processus actifs</td></tr><tr><td>pstree</td><td>Arbre processus</td></tr><tr><td>netscan</td><td>Connexions réseau</td></tr><tr><td>cmdline</td><td>Ligne de commande</td></tr><tr><td>malfind</td><td>Code injecté suspect</td></tr><tr><td>hashdump</td><td>Hashs Windows</td></tr><tr><td>dlllist</td><td>DLLs chargées</td></tr><tr><td>handles</td><td>Fichiers ouverts</td></tr></table><div class=\"box\">La RAM = scène de crime. Volatility = les experts. Le malware laisse des traces partout, même s il a effacé ses fichiers.</div><div class=\"bank\">Après un incident ransomware, la RAM contient souvent la clé de chiffrement et l IP de l attaquant.</div><div class=\"warn\">Capturer la RAM IMMÉDIATEMENT après un incident. Chaque seconde d utilisation écrase les preuves.</div>",
cas:"<h3>Cas 1 — Détecter un processus caché</h3><pre>vol.py -f memory.dmp pslist\nvol.py -f memory.dmp psscan\nvol.py -f memory.dmp pstree</pre><p>Comparer pslist et psscan : un processus dans psscan mais pas pslist = rootkit qui se cache.</p><h3>Cas 2 — Trouver un C2</h3><pre>vol.py -f memory.dmp netscan | grep ESTABLISHED</pre><p>Identifier connexions actives vers IPs suspectes. Corréler avec VirusTotal.</p><h3>Cas 3 — malfind</h3><pre>vol.py -f memory.dmp malfind</pre><p>Détecte code injecté en mémoire. Signature MZ dans régions non exécutables = injection probable.</p>",
quiz:[
{q:'Volatility analyse ?',o:['Disque','Mémoire RAM','Réseau','CPU'],c:1,e:'RAM.'},
{q:'Malware fileless ?',o:['Sur disque','Uniquement en mémoire','Dans BIOS','Dans DNS'],c:1,e:'Fileless.'}
]},

{id:7, titre:"Reverse engineering basique", intro:"Désassembler un malware permet de comprendre précisément ce qu il fait. C est l analyse la plus profonde.",
cours:"<h3>Assembleur — les bases</h3><table><tr><th>Instruction</th><th>Action</th></tr><tr><td>MOV</td><td>Copier valeur</td></tr><tr><td>PUSH/POP</td><td>Empiler/dépiler</td></tr><tr><td>CALL</td><td>Appeler fonction</td></tr><tr><td>JMP</td><td>Sauter</td></tr><tr><td>JE/JNE</td><td>Sauter si égal/différent</td></tr><tr><td>ADD/SUB</td><td>Additionner/soustraire</td></tr><tr><td>XOR</td><td>XOR bit à bit (chiffrement simple)</td></tr><tr><td>CMP</td><td>Comparer</td></tr></table><h3>Architecture x86/x64</h3><ul><li><strong>Registres</strong> : EAX (x86) / RAX (x64) accum, EBX base, ECX compteur, EDX données</li><li><strong>Stack</strong> : ESP (x86) / RSP (x64) — pile</li><li><strong>Instruction Pointer</strong> : EIP (x86) / RIP (x64) — adresse courante</li></ul><h3>Outils</h3><ul><li><strong>IDA Free</strong> — désassembleur référence</li><li><strong>Ghidra</strong> — gratuit NSA, décompilateur</li><li><strong>radare2</strong> — CLI puissant</li><li><strong>x64dbg</strong> — debugger Windows</li><li><strong>Binary Ninja</strong> — commercial</li></ul><h3>Workflow</h3><ol><li>Ouvrir le binaire dans Ghidra ou IDA</li><li>Identifier main / WinMain</li><li>Suivre les appels aux API (Imports)</li><li>Analyser les fonctions suspectes</li><li>Renommer les fonctions comprises</li><li>Reconstruire la logique</li></ol><h3>Patterns courants</h3><ul><li><strong>String obfuscation</strong> — chaînes chiffrées, décodées à l exécution</li><li><strong>Anti-debug</strong> — IsDebuggerPresent, timing checks</li><li><strong>Anti-VM</strong> — détection VMware, VirtualBox</li><li><strong>Persistence</strong> — écriture dans Run registry</li><li><strong>Injection</strong> — VirtualAllocEx + WriteProcessMemory + CreateRemoteThread</li></ul><div class=\"box\">Reverse engineering = démonter un moteur pièce par pièce pour comprendre comment il fonctionne. Le malware est le moteur.</div><div class=\"bank\">Les analystes bancaires RE démantèlent les trojans bancaires (Trickbot, Dridex) pour en extraire les IoC (Indicators of Compromise).</div><div class=\"warn\">Le RE demande des semaines pour un débutant. Commencer par Ghidra sur des crackmes simples.</div>",
cas:"<h3>Cas 1 — Ghidra</h3><ol><li>Créer un projet</li><li>Importer le binaire</li><li>Analyser automatiquement (Analyze → Auto Analyze)</li><li>Chercher les imports suspects</li><li>Double-cliquer sur les fonctions</li><li>Utiliser la vue decompiler (C-like)</li></ol><h3>Cas 2 — Détecter une persistance</h3><p>Chercher dans Ghidra les appels à <code>RegSetValueEx</code> avec comme chemin « Software\\Microsoft\\Windows\\CurrentVersion\\Run ». C est le point de persistance.</p><h3>Cas 3 — Analyser un chiffrement</h3><p>Boucle XOR avec une clé en dur. Ghidra affiche : <code>data[i] ^= 0x42</code>. En extraire la clé et décoder les strings.</p>",
quiz:[
{q:'IDA/Ghidra servent à ?',o:['Compiler','Désassembler','Router','Chiffrer'],c:1,e:'Désassemblage.'},
{q:'Persistence via registre ?',o:['Run key','HKEY_USERS','SAM','DNS'],c:0,e:'Run.'}
]},

{id:8, titre:"IoC et Threat Intelligence", intro:"IoC = Indicator of Compromise. Signature technique qui permet de détecter un malware connu.",
cours:"<h3>Qu est-ce qu un IoC</h3><p><strong>IoC</strong> = artefact observable qui indique une compromission. Utilisé pour détecter un malware déjà identifié.</p><h3>Types d IoC</h3><table><tr><th>Type</th><th>Exemple</th></tr><tr><td><strong>Hash</strong></td><td>SHA-256 du binaire</td></tr><tr><td><strong>Domaines</strong></td><td>malicious-c2.xyz</td></tr><tr><td><strong>IPs</strong></td><td>185.x.x.x (C2)</td></tr><tr><td><strong>URLs</strong></td><td>http://malicious-c2.xyz/gate.php</td></tr><tr><td><strong>Filename</strong></td><td>invoice.pdf.exe</td></tr><tr><td><strong>Registry key</strong></td><td>HKLM\\...\\Run\\malware</td></tr><tr><td><strong>Mutex</strong></td><td>Global\\MalwareMutex</td></tr><tr><td><strong>User-Agent</strong></td><td>MalwareBot/1.0</td></tr></table><h3>Sources de threat intel</h3><ul><li><strong>VirusTotal</strong> — analyse multi-antivirus</li><li><strong>MISP</strong> — plateforme de partage</li><li><strong>AlienVault OTX</strong> — open threat exchange</li><li><strong>Abuse.ch</strong> — URLhaus, MalwareBazaar, ThreatFox</li><li><strong>Shodan</strong> — C2 exposés</li><li><strong>URLhaus</strong> — URLs malveillantes</li><li><strong>Feodo Tracker</strong> — C2 bancaires</li></ul><h3>MITRE ATT&amp;CK</h3><p>Framework qui catalogue les techniques d attaques (Tactic, Technique, Procedure).</p><ul><li><strong>Tactic</strong> — objectif (Initial Access, Persistence, Exfiltration)</li><li><strong>Technique</strong> — comment (T1059 PowerShell)</li><li><strong>Procedure</strong> — implémentation spécifique</li></ul><h3>Utilisation en banque</h3><ul><li>SIEM intègre les IoC (règles de détection)</li><li>EDR détecte les binaires via hash</li><li>Pare-feu bloque les IPs C2</li><li>DNS sinkhole les domaines malveillants</li></ul><div class=\"box\">Un IoC = une empreinte digitale. Si un fichier/connexion a la même empreinte, c est probablement le même criminel.</div><div class=\"bank\">Les banques partagent leurs IoC au sein du FS-ISAC (Financial Services Information Sharing and Analysis Center).</div><div class=\"warn\">Un IoC est périssable. Un domaine C2 change souvent. Toujours combiner plusieurs IoC.</div>",
cas:"<h3>Cas 1 — VirusTotal</h3><ol><li>Aller sur virustotal.com</li><li>Uploader le binaire (ou coller son hash)</li><li>Voir : détections (70/72), famille (Emotet, Trickbot), IoCs</li><li>Onglet Relations : domaines, IPs contactés</li></ol><h3>Cas 2 — Chercher sur MISP</h3><p>Requête par hash SHA-256. Résultat : événement, attributs (IPs, domaines), contexte.</p><h3>Cas 3 — Créer une règle YARA</h3><pre>rule BankTrojan {\n    strings:\n        $c2 = \"malicious-c2.xyz\"\n        $marker = \"BankTrojan\"\n    condition:\n        $c2 or $marker\n}</pre><p>YARA scanne les fichiers pour détecter ces signatures. Intégré dans la plupart des EDR.</p>",
quiz:[
{q:'IoC signifie ?',o:['Indicators of Compromise','Internet of Code','Index of Content','Initial of Crime'],c:0,e:'Compromise.'},
{q:'MITRE ATT&CK ?',o:['Antivirus','Framework techniques attaque','Pare-feu','Langage'],c:1,e:'Tactics/Techniques.'}
]},

{id:9, titre:"Réponse à incident — Ransomware", intro:"Quand un ransomware frappe, chaque minute compte. Procédure de réponse structurée.",
cours:"<h3>Les 6 phases</h3><ol><li><strong>Détection</strong> — alerte EDR, utilisateurs bloqués, fichiers chiffrés</li><li><strong>Confinement</strong> — isoler les machines, couper le réseau</li><li><strong>Éradication</strong> — supprimer le malware, désactiver les comptes compromis</li><li><strong>Rétablissement</strong> — restaurer depuis sauvegardes saines</li><li><strong>Leçons apprises</strong> — post-mortem, amélioration</li><li><strong>Communication</strong> — clients, autorités, presse</li></ol><h3>Actions immédiates</h3><ul><li><strong>Isoler</strong> physiquement les machines infectées (débrancher le réseau)</li><li><strong>Ne PAS éteindre</strong> les machines (RAM = preuves)</li><li><strong>Photographier</strong> les écrans (message de rançon)</li><li><strong>Noter</strong> l heure, les fichiers affectés</li><li><strong>Débrancher</strong> les sauvegardes connectées (NAS)</li><li><strong>Alerter</strong> le RSSI, la direction, l assurance cyber</li></ul><h3>Ce qu il NE faut PAS faire</h3><ul><li>Payer la rançon (40% des payeurs ne récupèrent rien)</li><li>Redémarrer (l OS peut finir de chiffrer)</li><li>Continuer à utiliser les machines</li><li>Cacher l incident</li><li>Négocier seul</li></ul><h3>Investigation post-incident</h3><ul><li>Comment le malware est entré ? (phishing, RDP, VPN, supply chain)</li><li>Quand ? (timestamp du premier fichier chiffré)</li><li>Qui ? (IP source, comptes utilisés)</li><li>Quoi ? (données exfiltrées avant chiffrement ?)</li></ul><h3>Prévention</h3><ul><li>Sauvegarde 3-2-1 + immutable</li><li>MFA partout</li><li>EDR + SIEM 24/7</li><li>Segmentation réseau</li><li>Patch management</li><li>Sensibilisation utilisateurs</li></ul><div class=\"box\">Un ransomware = une inondation. Confiner = fermer les vannes. Éradiquer = pomper l eau. Rétablir = reconstruire. Apprendre = mieux drainer.</div><div class=\"bank\">BCEAO impose une notification d incident sous 72h. Non-notification = amende.</div><div class=\"warn\">Payer la rançon finance le crime organisé et n assure PAS la récupération.</div>",
cas:"<h3>Cas 1 — Confinement d urgence</h3><ol><li>Débrancher physiquement le câble réseau du PC infecté</li><li>Désactiver son port switch</li><li>Isoler dans un VLAN</li><li>Changer les mots de passe des comptes administrateurs</li><li>Révoquer les sessions actives</li></ol><h3>Cas 2 — Restaurer depuis sauvegardes</h3><ol><li>Identifier la dernière sauvegarde saine (avant chiffrement)</li><li>Vérifier son intégrité (SHA256)</li><li>Restaurer sur machine propre</li><li>Scanner avec antivirus à jour</li><li>Reconnecter au réseau seulement après validation</li></ol><h3>Cas 3 — Notification BCEAO</h3><p>Selon la directive, notifier : nature de l incident, données affectées, mesures prises, plan de remédiation.</p>",
quiz:[
{q:'Face à un ransomware ?',o:['Payer','Isoler + ne pas payer','Redémarrer','Ignorer'],c:1,e:'Isoler.'},
{q:'Sauvegarde 3-2-1 ?',o:['3 users,2 pass,1 admin','3 copies,2 supports,1 hors site','3 antivirus,2 pare-feu,1 VPN','Rien'],c:1,e:'3-2-1.'}
]},

{id:10, titre:"Analyse de cas réels — Emotet, Trickbot, Ryuk", intro:"Étude de 3 malwares qui ont fait tomber des milliers d entreprises et banques.",

function validerQuiz(id) {
  var d = null;
  for (var i = 0; i < DEFIS.length; i++) { if (DEFIS[i].id === id) { d = DEFIS[i]; break; } }
  if (!d) return;
  var correct = 0;
  for (var qi = 0; qi < d.quiz.length; qi++) {
    var q = d.quiz[qi];
    var sel = document.querySelector('input[name="q' + qi + '"]:checked');
    var labels = document.querySelectorAll('.q[data-i="' + qi + '"] label');
    for (var li = 0; li < labels.length; li++) { labels[li].classList.remove('ok','ko'); }
    var e = document.getElementById('exp' + qi); if (e) e.style.display = 'block';
    if (sel && parseInt(sel.value) === q.c) { correct++; labels[q.c].classList.add('ok'); }
    else { labels[q.c].classList.add('ok'); if (sel) labels[parseInt(sel.value)].classList.add('ko'); }
  }
  var u = user();
  if (correct === d.quiz.length) {
    var k = '7_' + id;
    if (!u.done[k]) {
      u.done[k] = true;
      var t = today();
      if (!u.jours[t]) u.jours[t] = [];
      if (u.jours[t].indexOf(k) === -1) u.jours[t].push(k);
    }
  }
  save();
  var r = document.getElementById('qr');
  var pass = correct === d.quiz.length;
  r.className = 'res ' + (pass ? 'g' : 'r');
  r.textContent = pass ? '🎉 ' + correct + '/' + d.quiz.length + ' — Défi validé !' : correct + '/' + d.quiz.length + ' — Réessaie';
  if (pass && id === 10 && isComplete(7)) {
    setTimeout(function(){ alert('🏆 Tu as terminé le Niveau 7 !'); }, 400);
  }
}

  var html = '<div class="card"><h2>🎓 Certifications</h2><div class="tabs">';
  html += '<div class="tab active" onclick="filterCerts(this,\'all\')">Toutes</div>';
  html += '<div class="tab" onclick="filterCerts(this,\'free\')">Gratuites</div>';
  html += '<div class="tab" onclick="filterCerts(this,\'paid\')">Payantes</div>';
  html += '<div class="tab" onclick="filterCerts(this,\'done\')">Obtenues</div>';
  html += '</div><div class="certs-grid">';
  for (var i = 0; i < CERTS.length; i++) {
    var c = CERTS[i];
    var isD = u.certs.indexOf(c.id) !== -1;
    html += '<div class="cert-item ' + (c.free ? 'free' : 'paid') + ' ' + (isD ? 'done' : '') + '" data-t="' + (c.free ? 'free' : 'paid') + '" data-d="' + (isD ? '1' : '0') + '">';
    html += '<h4>' + c.nom + '</h4><div class="org">' + c.org + '</div>';
    html += '<div><span class="tag ' + (c.free ? 'free' : 'paid') + '">' + (c.free ? 'GRATUIT' : c.prix) + '</span><span class="tag lvl">' + c.niv + '</span></div>';
    html += '<p>' + c.desc + '</p><a href="' + c.lien + '" target="_blank">Voir ↗</a>';
    html += ' <button class="sec" style="padding:5px 10px;font-size:.74em" onclick="toggleCert(\'' + c.id + '\')">' + (isD ? '✓' : 'Marquer') + '</button>';
    html += '</div>';
  }
  html += '</div></div>';
  document.getElementById('app').innerHTML = html;
}
function filterCerts(el, type) {
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
  el.classList.add('active');
  var items = document.querySelectorAll('.cert-item');
  for (var i = 0; i < items.length; i++) {
    var m = false;
    if (type === 'all') m = true;
    else if (type === 'done') m = items[i].dataset.d === '1';
    else m = items[i].dataset.t === type;
    items[i].style.display = m ? 'block' : 'none';
  }
}
function toggleCert(id) {
  var u = user(); if (!u) return;
  var i = u.certs.indexOf(id);
  if (i === -1) u.certs.push(id); else u.certs.splice(i, 1);
  save(); renderCerts();
}

function renderExamens() {
  var u = user(); if (!u) return;
  var html = '<div class="card"><h2>📝 Examens N7</h2>';
  var types = ['partiel','final'];
  for (var i = 0; i < types.length; i++) {
    var type = types[i];
    var e = EXAMENS[type];
    var passed = u.examens['7_' + type];
    var ready = true;
    for (var j = 0; j < e.req.length; j++) { if (!u.done['7_' + e.req[j]]) { ready = false; break; } }
    var cls = 'exam ' + (passed ? 'passed' : (ready ? '' : 'locked'));
    html += '<div class="' + cls + '"><h4>' + e.titre + '</h4><p style="font-size:.85em;color:#cbd5e1">' + e.desc + '</p>';
    if (passed) html += '<p style="color:#86efac;font-size:.85em">✅ ' + passed + '</p><button class="sec" onclick="go(\'examen/' + type + '\')">Refaire</button>';
    else if (ready) html += '<button class="gold" onclick="go(\'examen/' + type + '\')">Passer</button>';
    else html += '<p style="color:#fbbf24;font-size:.82em">🔒 Défis ' + e.req.join(', ') + '</p>';
    html += '</div>';
  }
  html += '</div>';
  document.getElementById('app').innerHTML = html;
}

function renderExamen(type) {
  var u = user(); if (!u) return;
  var e = EXAMENS[type]; if (!e) { go('examens'); return; }
  var ready = true;
  for (var j = 0; j < e.req.length; j++) { if (!u.done['7_' + e.req[j]]) { ready = false; break; } }
  if (!ready) { alert('Valide les défis requis.'); go('examens'); return; }
  var html = '<div class="card"><h2>' + e.titre + '</h2><p style="color:#94a3b8;font-size:.85em">' + e.desc + '</p><div class="quiz">';
  for (var qi = 0; qi < e.qs.length; qi++) {
    var q = e.qs[qi];
    html += '<div class="q" data-i="' + qi + '"><p>Q' + (qi + 1) + '. ' + q.q + '</p>';
    for (var oi = 0; oi < q.o.length; oi++) {
      html += '<label><input type="radio" name="ex' + qi + '" value="' + oi + '"> ' + q.o[oi] + '</label>';
    }
    html += '<div class="exp" id="exexp' + qi + '">' + q.e + '</div></div>';
  }
  html += '<button onclick="validerExamen(\'' + type + '\')">Soumettre</button><div id="er"></div></div></div>';
  document.getElementById('app').innerHTML = html;
}

function validerExamen(type) {
  var u = user(); if (!u) return;
  var e = EXAMENS[type]; if (!e) return;
  var correct = 0;
  for (var qi = 0; qi < e.qs.length; qi++) {
    var q = e.qs[qi];
    var sel = document.querySelector('input[name="ex' + qi + '"]:checked');
    var labels = document.querySelectorAll('.q[data-i="' + qi + '"] label');
    for (var li = 0; li < labels.length; li++) { labels[li].classList.remove('ok','ko'); }
    var ex = document.getElementById('exexp' + qi); if (ex) ex.style.display = 'block';
    if (sel && parseInt(sel.value) === q.c) { correct++; labels[q.c].classList.add('ok'); }
    else { labels[q.c].classList.add('ok'); if (sel) labels[parseInt(sel.value)].classList.add('ko'); }
  }
  var pct = Math.round(correct / e.qs.length * 100);
  var req = type === 'final' ? 80 : 60;
  var pass = pct >= req;
  if (pass) { u.examens['7_' + type] = today(); save(); }
  var r = document.getElementById('er');
  r.className = 'res ' + (pass ? 'g' : 'r');
  r.textContent = pass ? '🎉 ' + correct + '/' + e.qs.length + ' (' + pct + '%)' : correct + '/' + e.qs.length + ' (' + pct + '%) — Il faut ' + req + '%';
}

function b64(s) { try { return btoa(unescape(encodeURIComponent(s))); } catch(e) { return ''; } }
function unb64(b) { try { return decodeURIComponent(escape(atob(b.replace(/\s/g,'')))); } catch(e) { return null; } }
function exportCode() { return b64(JSON.stringify(state)); }
function importCode(c) { var j = unb64(c.trim()); if (!j) return false; try { var d = JSON.parse(j); if (!d) return false; state = Object.assign({}, state, d); save(); return true; } catch(e) { return false; } }
function dlBackup() { var b = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'}); var url = URL.createObjectURL(b); var a = document.createElement('a'); a.href = url; a.download = 'mdpc-n7-' + today() + '.json'; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); }
function readFile(input) { var f = input.files[0]; if (!f) return; var r = new FileReader(); r.onload = function(e) { try { var d = JSON.parse(e.target.result); state = Object.assign({}, state, d); save(); alert('Restauré !'); route(); } catch(err) { alert('Invalide'); } }; r.readAsText(f); }

function renderSync() {
  var code = exportCode();
  var html = '<div class="card"><h2>🌐 Sync</h2></div>';
  html += '<div class="card"><h3>📋 Code</h3><div class="sync-box"><label>Ton code</label><textarea id="so" readonly onclick="this.select()">' + code + '</textarea><div style="margin-top:8px"><button onclick="copyCode()">Copier</button></div></div>';
  html += '<div class="sync-box"><label>Coller un code</label><textarea id="si" placeholder="Colle ici..."></textarea><div style="margin-top:8px"><button onclick="applyCode()">Restaurer</button></div></div></div>';
  html += '<div class="card"><h3>💾 Fichier</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button onclick="dlBackup()">Télécharger</button><input type="file" id="bf" accept=".json" style="display:none" onchange="readFile(this)"><button class="sec" onclick="document.getElementById(\'bf\').click()">Importer</button></div></div>';
  document.getElementById('app').innerHTML = html;
}
function copyCode() { var ta = document.getElementById('so'); ta.select(); try { document.execCommand('copy'); alert('Copié !'); } catch(e) { alert('Manuel'); } }
function applyCode() { var c = document.getElementById('si').value; if (!c.trim()) { alert('Colle un code.'); return; } if (importCode(c)) { alert('Restauré !'); route(); } else alert('Code invalide.'); }

function route() {
  try {
    header();
    if (!state.currentUser) { renderLogin(); return; }
    if (!isUnlocked(7)) { renderLocked(); return; }
    var h = (location.hash || '#home').slice(1);
    var p = h.split('/');
    if (p[0] === 'home' || p[0] === '') return renderHome();
    if (p[0] === 'defi' && p[1]) return renderDefi(parseInt(p[1]));
    if (p[0] === 'certif') return renderCertif();
    if (p[0] === 'cv') return renderCV();
    if (p[0] === 'stats') return renderStats();
    if (p[0] === 'jobs') return renderJobs();
    if (p[0] === 'examens') return renderExamens();
    if (p[0] === 'examen' && p[1]) return renderExamen(p[1]);
    if (p[0] === 'certs') return renderCerts();
    if (p[0] === 'sync') return renderSync();
    renderHome();
  } catch(e) {
    console.error('Route error:', e);
    document.getElementById('app').innerHTML = '<div class="card"><h2 style="color:#ef4444">Erreur</h2><p style="color:#ef4444">' + e.message + '</p><pre style="color:#fca5a5;font-size:.8em;white-space:pre-wrap">' + (e.stack || '') + '</pre></div>';
  }
}
window.addEventListener('hashchange', route);
try { route(); } catch(e) {
  document.getElementById('app').innerHTML = '<div class="card"><h2 style="color:#ef4444">Erreur init</h2><p style="color:#ef4444">' + e.message + '</p></div>';
}
</script>
